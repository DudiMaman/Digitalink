<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A1311" />

    <!-- בחירת theme לפי הנתיב: /v1/ → מצב בהיר, אחרת כהה -->
    <script>
      if (location.pathname.includes('/v1')) {
        document.documentElement.classList.add('light')
      }
    </script>

    <title>Digital Link | סוכנות דיגיטל — סושיאל, PPC, SEO, GEO ואוטומציה</title>
    <meta
      name="description"
      content="Digital Link — Your Digital Partner. סוכנות דיגיטל שמתמחה בסושיאל מדיה, קמפיינים ממומנים (PPC), קידום אורגני (SEO), אופטימיזציה למנועי בינה (GEO) ואוטומציית שיווק. הופכים נוכחות דיגיטלית לתוצאות."
    />
    <meta name="keywords" content="סוכנות דיגיטל, סושיאל מדיה, PPC, SEO, GEO, אוטומציית שיווק, שיווק דיגיטלי" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:title" content="Digital Link | Your Digital Partner" />
    <meta
      property="og:description"
      content="הופכים נוכחות דיגיטלית לתוצאות — סושיאל, PPC, SEO, GEO ואוטומציית שיווק."
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&family=Rubik:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
